name: Release

# Runs when a tag like v0.0.1 is pushed. The tag must match hashira.versionName in gradle.properties.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^hashira\.versionName=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match hashira.versionName ($version)" >&2
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.HASHIRA_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HASHIRA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          HASHIRA_KEYSTORE_PASSWORD: ${{ secrets.HASHIRA_KEYSTORE_PASSWORD }}
          HASHIRA_KEY_ALIAS: ${{ secrets.HASHIRA_KEY_ALIAS }}
          HASHIRA_KEY_PASSWORD: ${{ secrets.HASHIRA_KEY_PASSWORD }}
        run: ./release.sh --no-tag

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "hashira ${GITHUB_REF_NAME#v}" --generate-notes
